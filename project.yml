project:
  name: "NFP Food Insecurity Map"
  slug: "nfp-food-insecurity-map"
  primary_org: "Nashville Food Project"
  secondary_org: "BDAIC"

geography:
  state_fips: "47"
  state_name: "Tennessee"
  msa_name: "Nashville-Davidson-Murfreesboro-Franklin"
  msa_counties:
    - fips: "015"
      name: "Cannon County"
    - fips: "021"
      name: "Cheatham County"
    - fips: "037"
      name: "Davidson County"
    - fips: "043"
      name: "Dickson County"
    - fips: "081"
      name: "Hickman County"
    - fips: "111"
      name: "Macon County"
    - fips: "119"
      name: "Maury County"
    - fips: "147"
      name: "Robertson County"
    - fips: "149"
      name: "Rutherford County"
    - fips: "159"
      name: "Smith County"
    - fips: "165"
      name: "Sumner County"
    - fips: "169"
      name: "Trousdale County"
    - fips: "187"
      name: "Williamson County"
    - fips: "189"
      name: "Wilson County"
  map_center: [36.05, -86.60]
  default_zoom: 9
  tiger_year: 2023

data_sources:
  census_acs:
    source_type: s3
    s3_bucket: bdaic-public-transform
    s3_prefix:
      tract: "census_acs5/geo_tract/"
      zip: "census_acs5/geo_zipcode/"
    output_prefix: acs
    geoid_column: geoid
    frontend_src: acs
    variables:
      - id: median_household_income
        column: "Median Household Income"
        display_name: "Median Household Income"
        colormap: YlGnBu
        palette: greens
        legend_name: "Median Household Income ($)"
        format_str: "${:,.0f}"
        tooltip_alias: "Income"
        default_visible: true
        data_year: "2020–2024"
        caption: "ACS 2020–2024 5-year estimates."
      - id: poverty_rate
        column: "Percent of Population Below Poverty Level"
        display_name: "Poverty Rate"
        colormap: YlOrRd
        palette: oranges
        legend_name: "Poverty Rate (%)"
        format_str: "{:.1f}%"
        tooltip_alias: "Poverty"
        default_visible: false
        multiplier: 100
        data_year: "2020–2024"
        caption: "Share of population below federal poverty line."
      - id: total_population
        column: "Total Population"
        display_name: "Total Population"
        colormap: Blues
        palette: teals
        legend_name: "Population"
        format_str: "{:,.0f}"
        tooltip_alias: "Population"
        default_visible: false
        data_year: "2020–2024"
        caption: "Total population (ACS)."
      - id: snap_benefits
        column: "Percent of Households that received SNAP benefits"
        display_name: "Households receiving SNAP benefits"
        colormap: BuPu
        palette: purples
        legend_name: "HHD SNAP Benefits (%)"
        format_str: "{:.1f}%"
        tooltip_alias: "SNAP"
        default_visible: false
        multiplier: 100
        data_year: "2020–2024"
        caption: "HHD SNAP Benefits (ACS)."

  health_lila:
    source_type: s3
    s3_bucket: bdaic-public-transform
    s3_prefix:
      tract: "cdc_places/census_tract/"
      zip: "cdc_places/zcta/"
    output_prefix: health_lila
    geoid_column: LocationID
    frontend_src: health
    filters:
      - column: Data_Value_Type
        value: "Crude prevalence"
    variables:
      - id: diabetes
        column: DIABETES
        display_name: "Diabetes Prevalence"
        colormap: PuRd
        palette: purples
        legend_name: "Diabetes Prevalence (%)"
        format_str: "{:.1f}%"
        tooltip_alias: "Diabetes"
        default_visible: false
        data_year: "2024"
        caption: "CDC PLACES modeled prevalence."
      - id: hypertension
        column: BPHIGH
        display_name: "Hypertension Prevalence"
        colormap: Reds
        palette: reds
        legend_name: "Hypertension Prevalence (%)"
        format_str: "{:.1f}%"
        tooltip_alias: "Hypertension"
        default_visible: false
        data_year: "2024"
        caption: "CDC PLACES high blood pressure prevalence."
      - id: obesity
        column: OBESITY
        display_name: "Obesity Prevalence"
        colormap: OrRd
        palette: ambers
        legend_name: "Obesity Prevalence (%)"
        format_str: "{:.1f}%"
        tooltip_alias: "Obesity"
        default_visible: false
        data_year: "2024"
        caption: "CDC PLACES obesity prevalence (BMI ≥ 30)."

  usda_lila:
    source_type: s3
    s3_bucket: bdaic-public-transform
    s3_prefix:
      tract: "nfp-mapping/usda/lila/tract/"
    source_key: "nfp-mapping/usda/lila/source/food_access_research_atlas.csv"
    crosswalk_key: "nfp-mapping/usda/lila/crosswalk/tract_2010_to_2020_tn.csv"
    output_prefix: usda_lila
    source_geoid_column: CensusTract
    source_geoid_vintage: "2010"
    target_geoid_vintage: "2020"
    frontend_src: lila
    tract_only: true
    note: "LILA data uses 2010 Census tract boundaries. Converted to 2020 tracts via Census Bureau relationship file. Tract-level only (no ZIP aggregation)."
    variables:
      - id: lila_flag
        column: LILATracts_1And10
        display_name: "LILA Designation (1 & 10 mi)"
        colormap: RdYlGn_r
        palette: categorical
        legend_name: "Low Income + Low Access"
        format_str: "{}"
        tooltip_alias: "LILA"
        default_visible: false
        layer_type: categorical
        data_year: "2019"
        caption: >
          USDA designation: a low-income tract (poverty rate ≥20%, or median
          family income ≤80% of the statewide or metro-area median) where ≥500
          residents or ≥33% of the population live more than 1 mile (urban) or
          10 miles (rural) from the nearest supermarket.
          Source: USDA ERS Food Access Research Atlas, 2019.
        categories:
          0: "Not LILA"
          1: "LILA Tract"
      - id: lapop1
        column: lapop1
        display_name: "Low Access Population (1 mi)"
        colormap: BuPu
        palette: teals
        legend_name: "Population Beyond 1 mi from Supermarket"
        format_str: "{:,.0f}"
        tooltip_alias: "Low Access Pop"
        default_visible: false
        data_year: "2019"
        caption: >
          Number of residents living more than 1 mile from the nearest
          supermarket, regardless of income (USDA's 1-mile measure, applied to
          urban and rural tracts alike).
          Source: USDA ERS Food Access Research Atlas, 2019.
      - id: lalowi1
        column: lalowi1
        display_name: "Low Income, Low Access Population (1 mi)"
        colormap: YlOrBr
        palette: ambers
        legend_name: "Low Income Pop Beyond 1 mi"
        format_str: "{:,.0f}"
        tooltip_alias: "LI Low Access Pop"
        default_visible: false
        data_year: "2019"
        caption: >
          Low-income residents (income at or below 200% of the federal poverty
          level) who live more than 1 mile from the nearest supermarket.
          Source: USDA ERS Food Access Research Atlas, 2019.

  food_insecurity_index:
    source_type: computed   # computed in-process by pipeline/process_food_insecurity.py
    output_prefix: food_insecurity
    frontend_src: fsi
    tract_only: true
    note: >
      Tennessee census-tract food-insecurity index. Computed in-process from
      ACS 5-year profile predictors + Feeding America (Map the Meal Gap) county
      rates via the vendored calculation in pipeline/food_insecurity/, then
      filtered from all 95 TN counties down to the MSA. Methodology mirror of
      Belmont-Data-and-AI-Collaborative/bdaic-food-security-index-census-tract-level-etl.
    variables:
      - id: food_insecurity_rate
        column: "food_insecurity_rate"
        display_name: "Food Insecurity Rate"
        colormap: YlOrRd
        palette: oranges
        legend_name: "Food Insecurity Rate (%)"
        format_str: "{:.1f}%"
        tooltip_alias: "Food Insecurity"
        default_visible: false
        multiplier: 100   # stored 0-1 proportion -> percent for the frontend formatter
        data_year: "2023"
        caption: >
          Modeled tract-level food insecurity, downscaled from Feeding America
          county rates (Map the Meal Gap 2025) using ACS predictors. v1 uses
          overall poverty as a placeholder for non-student poverty (B14006),
          which can overstate insecurity in student-heavy tracts.
      - id: food_insecure_count
        column: "food_insecure_count"
        display_name: "Food Insecure Population"
        colormap: YlOrBr
        palette: ambers
        legend_name: "Estimated Food Insecure Persons"
        format_str: "{:,.0f}"
        tooltip_alias: "FI Population"
        default_visible: false
        data_year: "2023"
        caption: >
          Estimated number of food-insecure residents per tract
          (food insecurity rate × tract population).

  giving_matters:
    source_type: s3
    s3_bucket: bdaic-public-transform
    s3_key: "nfp-mapping/partners/giving_matters.csv"
    output_prefix: giving_matters
    enabled: true
    note: "Giving Matters nonprofit data from CFMT. Categories assigned by LLM classification against NFP partner types; see scripts/classify_giving_matters.py."
    required_columns:
      name_column: partner_name
      address_column: address
      category_column: partner_type
    geocode_cache_key: "nfp-mapping/partners/giving_matters_geocode_cache.csv"
    suppress_types:
      - arts_culture
      - animal_welfare
      - sports_recreation
      - historical_preservation
      - public_media
    point_layer_name: "Community Partners (Giving Matters)"
    marker_style: "circle"  # Use circle markers to distinguish from NFP partner pins
    default_color: "#17BECF"

partners:
  source_type: s3
  s3_bucket: bdaic-public-transform
  s3_key: "nfp-mapping/partners/nfp_partners.csv"
  geocode_cache_key: "nfp-mapping/partners/geocode_cache.csv"
